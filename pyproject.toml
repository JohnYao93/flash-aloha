[project]
name = "flash_aloha"
version = "0.1.0"
description = "Flash ALOHA capture, recording, ACT/Flow training and inference"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "John Yao" }]
requires-python = ">=3.10"
dependencies = [
    "av>=15.1.0",
    "evdev>=1.9.3; sys_platform == 'linux'",
    "getkey>=0.6.5",
    "ipython>=8.37.0",
    "lerobot==0.4.4",
    "matplotlib>=3.10.6",
    "msgpack>=1.0.5",
    "opencv-python>=4.11.0.86",
    "pyyaml>=6.0.2",
    "robotmq==0.1.15",
    "scipy>=1.15.3",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm>=4.67.1",
    "transformers>=4.50.3,<4.52.0",
    "urdf-parser-py>=0.0.4",
    "wandb>=0.20.1",
    "websockets>=14.0",
    "zarr>=2.18.3,<3",
    "numpy>=1.26",
    "rerun-sdk==0.26.2",
]

[tool.uv]
exclude-dependencies = ["opencv-python-headless"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
exclude = ["hardware.arx5-sdk*", "kdl_parser*"]

[tool.setuptools.package-data]
config = ["*.yaml", "tasks/*.yaml", "training/*.yaml", "inference/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["src", "scripts/tests"]
